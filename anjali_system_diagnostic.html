<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Anjali App — System Diagnostic Panel</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#fff0f5,#fde2ea);
}
.container{
  max-width:1000px;
  margin:20px auto;
  padding:20px;
}
h1{
  text-align:center;
  color:#8b0037;
}
.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:30px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 18px rgba(0,0,0,0.1);
}
.file-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.file-name{font-weight:600;color:#333;}
.percent{font-weight:bold;color:#8b0037;}
.progress{
  width:100%;
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:8px 0;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#ff6a88,#ff99ac);
}
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.status{font-size:13px;color:#555;}
button{
  background:linear-gradient(135deg,#ff6a88,#ff2f68);
  border:none;
  color:#fff;
  padding:5px 14px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
}
button.error{
  background:linear-gradient(135deg,#b00020,#ff1744);
}
button:hover{opacity:.9}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:999;
}
.modal-content{
  background:#fff;
  max-width:600px;
  margin:8% auto;
  padding:20px;
  border-radius:14px;
}
.modal h3{margin-top:0;color:#8b0037;}
.close{
  float:right;
  cursor:pointer;
  font-size:18px;
}
pre{
  background:#f7f7f7;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  white-space:pre-wrap;
}
.footer{
  text-align:center;
  margin-top:30px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">
<h1>🌸 Anjali App — System Diagnostic</h1>
<div class="subtitle">अंजली की चेतना, स्मृति, संवाद और प्रेम-तंत्र की शुद्धता</div>

<!-- TEMPLATE CARD (Repeated manually for accuracy) -->

  <div class="file-row">
    <div class="file-name">index.html</div>
    <div class="percent">85%</div>
  </div>
  <div class="progress"><div class="bar" style="width:85%"></div></div>
  <div class="actions">
    <div class="status">UI कार्यरत, Emotion hooks शेष</div>
    <div>
      <button>देखें</button>
      <button class="error" onclick="showError('index')">Error</button>
    </div>
  </div>
</div>

<!-- core -->
<div class="card">
  <div class="file-row"><div class="file-name">core/AnjaliCore.js</div><div class="percent">95%</div></div>
  <div class="progress"><div class="bar" style="width:95%"></div></div>
