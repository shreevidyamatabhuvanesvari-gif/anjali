<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Anjali App — REAL System Diagnostic</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#fff0f5,#fde2ea);
}
.container{
  max-width:1000px;
  margin:20px auto;
  padding:20px;
}
h1{
  text-align:center;
  color:#8b0037;
}
.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:30px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 18px rgba(0,0,0,0.1);
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.module{
  font-weight:600;
  color:#333;
}
.status-ok{
  color:#2e7d32;
  font-weight:bold;
}
.status-error{
  color:#c62828;
  font-weight:bold;
}
.status-missing{
  color:#ef6c00;
  font-weight:bold;
}
.proof{
  font-size:13px;
  color:#555;
  margin-top:4px;
}
pre{
  background:#f7f7f7;
  padding:10px;
  border-radius:10px;
  font-size:13px;
  white-space:pre-wrap;
}
.footer{
  text-align:center;
  margin-top:30px;
  font-size:13px;
  color:#777;
}
.notice{
  text-align:center;
  font-size:13px;
  color:#6b2c2c;
  margin-bottom:20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🌸 Anjali App — REAL System Diagnostic</h1>
  <div class="subtitle">
    यह पैनल अनुमान नहीं, <b>index.html से प्राप्त runtime सत्य</b> दिखाता है
  </div>

  <div class="notice">
    ⚠️ यदि कोई मॉड्यूल “MISSING / ERROR” दिखे,  
    तो पहले <b>index.html</b> खोलकर सिस्टम चलाएँ।
  </div>

  <div id="diagnosticResults"></div>

  <div class="footer">
    🌸 Anjali App • Truth-based Diagnostic System
  </div>
</div>

  <!-- ===============================
     DIAGNOSTIC ENGINES (ORDER MATTERS)
     =============================== -->
<script src="diagnostics/anjali_diagnostic_bridge.js"></scri
<script src="diagnostics/anjali_diagnostic_spec.js"></script>
<script src="diagnostics/anjali_diagnostic_weights.js"></script>

<script src="diagnostics/anjali_real_diagnostic.js" defer></script>
<script src="diagnostics/anjali_diagnostic_score.js"></script>
  <script src="diagnostics/anjali_diagnostic_weights.js"></script>
<script>
/* ===============================
   REAL DIAGNOSTIC RENDERER
   =============================== */

document.addEventListener("DOMContentLoaded", function () {

  const container = document.getElementById("diagnosticResults");

  let raw = null;
  try {
    raw =
      window.AnjaliRealDiagnosticReport ||
      JSON.parse(localStorage.getItem("ANJALI_REAL_DIAGNOSTIC"));
  } catch (e) {
    raw = null;
  }

  if (!raw) {
    container.innerHTML = `
      <div class="card">
        ❌ Diagnostic data उपलब्ध नहीं है।<br><br>
        कृपया पहले <b>index.html</b> खोलकर
        अंजली को प्रारंभ करें, फिर यहाँ आएँ।
      </div>
    `;
    return;
  }

  /* ===== SCORE PERCENT RENDER ===== */
  if (typeof raw.scorePercent === "number") {
    const percent = Math.max(0, Math.min(100, raw.scorePercent));

    const scoreCard = document.createElement("div");
    scoreCard.className = "card";
    scoreCard.innerHTML = `
      <div class="row">
        <div class="module">Overall System Health</div>
        <div class="status-ok">${percent}%</div>
      </div>
      <div class="proof">
        Calculated from runtime checks (OK = full, PARTIAL = half, MISSING = zero)
      </div>
      <div style="margin-top:10px;height:10px;background:#eee;border-radius:10px;overflow:hidden;">
        <div style="width:${percent}%;height:100%;background:linear-gradient(90deg,#4caf50,#81c784);border-radius:10px;"></div>
      </div>
    `;
    container.appendChild(scoreCard);
  }

  /* ===== GENERATED TIME ===== */
  let html = `
    <div class="card">
      <b>Generated At:</b> ${raw.timestamp}
    </div>
  `;

  /* ===== MODULE RESULTS ===== */
  raw.results.forEach(m => {
    let statusClass = "status-missing";
    if (m.status === "OK") statusClass = "status-ok";
    if (m.status === "ERROR") statusClass = "status-error";

    html += `
      <div class="card">
        <div class="row">
          <div class="module">${m.module}</div>
          <div class="${statusClass}">${m.status}</div>
        </div>
        <div class="proof">Proof: ${m.proof}</div>
      </div>
    `;
  });

  /* ===== RUNTIME ERRORS ===== */
  if (raw.errors && raw.errors.length) {
    html += `
      <div class="card">
        <h3>🚨 Runtime Errors</h3>
        ${raw.errors.map(e =>
          `<pre>${e.message || e}</pre>`
        ).join("")}
      </div>
    `;
  }

  container.innerHTML += html;

});
</script>

</body>
</html>
