<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Anjali App — REAL System Diagnostic</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#fff0f5,#fde2ea);
}
.container{
  max-width:1000px;
  margin:20px auto;
  padding:20px;
}
h1{
  text-align:center;
  color:#8b0037;
}
.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:30px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 18px rgba(0,0,0,0.1);
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.module{
  font-weight:600;
  color:#333;
}
.status-ok{color:#2e7d32;font-weight:bold;}
.status-error{color:#c62828;font-weight:bold;}
.status-missing{color:#ef6c00;font-weight:bold;}
.proof{
  font-size:13px;
  color:#555;
  margin-top:4px;
}
.footer{
  text-align:center;
  margin-top:30px;
  font-size:13px;
  color:#777;
}
pre{
  background:#f7f7f7;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🌸 Anjali App — REAL System Diagnostic</h1>
  <div class="subtitle">
    यह पैनल अनुमान नहीं, <b>runtime सत्य</b> दिखाता है
  </div>

  <!-- 🔍 REAL DIAGNOSTIC OUTPUT -->
  <div id="diagnosticResults"></div>

  <div class="footer">
    🌸 Anjali App • Truth-based Diagnostic System
  </div>
</div>

<!-- ================= REAL DIAGNOSTIC ENGINE ================= -->
<script src="diagnostics/anjali_real_diagnostic.js"></script>

<!-- ================= ENGINE → UI BRIDGE ================= -->
<script src="diagnostics/anjali_diagnostic_bridge.js"></script>

<!-- ================= UI RENDERER ================= -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const container = document.getElementById("diagnosticResults");
  const data = window.AnjaliUIDiagnosticData;

  if (!data || data.error) {
    container.innerHTML = "<div class='card'>❌ Diagnostic data उपलब्ध नहीं है</div>";
    return;
  }

  let html = `
    <div class="card">
      <b>Generated At:</b> ${data.generatedAt}
    </div>
  `;

  data.modules.forEach(m => {
    let statusClass = "status-missing";
    if (m.status === "OK") statusClass = "status-ok";
    if (m.status === "ERROR") statusClass = "status-error";

    html += `
      <div class="card">
        <div class="row">
          <div class="module">${m.module}</div>
          <div class="${statusClass}">${m.status}</div>
        </div>
        <div class="proof">Proof: ${m.proof}</div>
      </div>
    `;
  });

  if (data.runtimeErrors && data.runtimeErrors.length) {
    html += `
      <div class="card">
        <h3>🚨 Runtime Errors</h3>
        ${data.runtimeErrors.map(e =>
          `<pre>${e.message}\n${e.source || ""}</pre>`
        ).join("")}
      </div>
    `;
  }

  container.innerHTML = html;
});
</script>

</body>
</html>
