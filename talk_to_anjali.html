<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title>Anjali से बात करें</title>

  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      color: #facc15;
    }

    textarea {
      width: 100%;
      height: 80px;
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .chat {
      margin-top: 20px;
      background: #020617;
      padding: 15px;
      border-radius: 6px;
    }

    .user { color: #38bdf8; }
    .anjali { color: #f472b6; margin-top: 10px; }
  </style>
</head>

<body>

  <h1>🌸 अंजली से बात करें</h1>

  <textarea id="userInput" placeholder="यहाँ लिखिए..."></textarea>
  <br>
  <button onclick="sendToAnjali()">बोलो</button>

  <div class="chat">
    <div id="userText" class="user"></div>
    <div id="anjaliText" class="anjali"></div>
  </div>

  <script>
    function sendToAnjali() {
      const text = document.getElementById("userInput").value.trim();
      if (!text) return;

      document.getElementById("userText").textContent = "आप: " + text;
      document.getElementById("anjaliText").textContent = "अंजली सोच रही है…";

      // Core को सक्रिय करो
      if (window.AnjaliCore && !AnjaliCore.isActive()) {
        AnjaliCore.start();
      }

      // सीधे ReasoningEngine को भेजो
      if (window.ReasoningEngine) {
        ReasoningEngine.process(text);
      }

      // ResponseEngine बोले / दिखाए
      setTimeout(() => {
        const last = window.ResponseEngine?.getStatus?.().lastResponse;
        if (last && last.text) {
          document.getElementById("anjaliText").textContent =
            "अंजली: " + last.text;
        } else {
          document.getElementById("anjaliText").textContent =
            "अंजली: (कोई उत्तर नहीं आया)";
        }
      }, 300);
    }
  </script>

</body>
</html>
