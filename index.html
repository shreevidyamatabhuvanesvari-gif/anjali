<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>अंजली</title>

  <style>
    :root{
      --bg1:#fff3ea;
      --bg2:#ffe1cf;
      --accent:#8b2d2d;
      --soft:#b35c5c;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", Arial, sans-serif;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:92%;
      max-width:420px;
      background:var(--card);
      border-radius:22px;
      padding:22px 18px 24px;
      box-shadow:0 14px 30px rgba(0,0,0,.12);
      text-align:center;
    }
    .avatar{
      width:96px;
      height:96px;
      margin:6px auto 12px;
      border-radius:50%;
      overflow:hidden;
      border:3px solid #f0c4c4;
      box-shadow:0 6px 14px rgba(0,0,0,.15);
    }
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .title{font-size:26px;color:var(--accent);margin:6px 0 4px;}
    .subtitle{font-size:14px;color:#555;margin-bottom:14px;}
    .status{
      background:#fff7f4;
      border:1px solid #f3d4c7;
      border-radius:14px;
      padding:10px 12px;
      font-size:13px;
      color:#6b2c2c;
      margin:10px 0 10px;
    }
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .btn{
      border:none;border-radius:16px;
      padding:12px 16px;font-size:14px;cursor:pointer;
      background:linear-gradient(180deg,#c96a6a,#a13f3f);
      color:#fff;
    }
    .btn.secondary{
      background:#fff;color:var(--soft);
      border:1px dashed #e6b2b2;
    }
    .footer{
      margin-top:14px;
      font-size:11px;
      color:#777;
      text-align:center;
    }
  </style>
</head>
<script>
let brainWindow = null;

// Admin Brain खोलना
document.getElementById("adminBtn").onclick = () => {
  brainWindow = window.open("admin.html", "_blank");
};

// Brain से आने वाले जवाब सुनना
window.addEventListener("message", (event) => {
  if (!event.data) return;

  if (event.data.type === "ANJALI_REPLY") {
    const text = event.data.text;
    const emotion = event.data.emotion;

    // स्क्रीन पर दिखाओ
    const status = document.getElementById("appStatus");
    if (status) status.textContent = "Anjali: " + text;

    // आवाज़ से बोलवाओ
    if (window.TTS) {
      TTS.speak(text);
    }

    // Emotion update hook
    if (window.updateEmotion) {
      updateEmotion(emotion);
    }
  }
});

  // 🔊 Anjali बोले बटन
document.getElementById("speakBtn").onclick = () => {
  if (!lastAnjaliReply) {
    alert("Anjali ने अभी कुछ कहा नहीं है");
    return;
  }

  if (window.TTS) {
    TTS.speak(lastAnjaliReply);
  }
};
  
</script>

  🌸 अंजली से बात करें
