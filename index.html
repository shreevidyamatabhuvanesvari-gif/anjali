<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>अंजली</title>

  <style>
    :root{
      --bg1:#fff3ea;
      --bg2:#ffe1cf;
      --accent:#8b2d2d;
      --soft:#b35c5c;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", Arial, sans-serif;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:92%;
      max-width:420px;
      background:var(--card);
      border-radius:22px;
      padding:22px 18px 24px;
      box-shadow:0 14px 30px rgba(0,0,0,.12);
      text-align:center;
    }
    .avatar{
      width:96px;
      height:96px;
      margin:6px auto 12px;
      border-radius:50%;
      overflow:hidden;
      border:3px solid #f0c4c4;
      box-shadow:0 6px 14px rgba(0,0,0,.15);
    }
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .title{font-size:26px;color:var(--accent);margin:6px 0 4px;}
    .subtitle{font-size:14px;color:#555;margin-bottom:14px;}
    .status{
      background:#fff7f4;
      border:1px solid #f3d4c7;
      border-radius:14px;
      padding:10px 12px;
      font-size:13px;
      color:#6b2c2c;
      margin:10px 0 10px;
    }
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .btn{
      border:none;border-radius:16px;
      padding:12px 16px;font-size:14px;cursor:pointer;
      background:linear-gradient(180deg,#c96a6a,#a13f3f);
      color:#fff;
    }
    .btn.secondary{
      background:#fff;color:var(--soft);
      border:1px dashed #e6b2b2;
    }
    .footer{
      margin-top:14px;
      font-size:11px;
      color:#777;
      text-align:center;
    }
  </style>
</head>
<body>
<main class="card">

  <!-- 🔐 PASSWORD GATE (ADDED) -->
  <div id="passwordGate" class="status">
    <b>🔐 10 अंकों का पासवर्ड</b><br><br>
    <input
      type="password"
      id="passwordInput"
      maxlength="10"
      placeholder="**********"
      style="width:100%;padding:8px;font-size:15px"
    >
    <br><br>
    <button class="btn secondary" onclick="verifyPassword()">सत्यापित करें</button>
    <div id="passwordMsg" style="color:#a13f3f;margin-top:6px;"></div>
  </div>
  <!-- 🔐 PASSWORD GATE END -->

  <div class="avatar">
    <img src="avatar.png" alt="Anjali Avatar">
  </div>

  <div class="title">अंजली</div>
  <div class="subtitle">स्नेहपूर्ण • समझदार • मर्यादित</div>

  <div class="status" id="appStatus">अंजली तैयार है</div>
  <div class="status" id="emotionStatus">भाव: 😌 शांत</div>

  <div class="actions">
    <button class="btn" id="startBtn" disabled>शुरू करें</button>
    <button id="speakBtn">🔊 Anjali बोले</button>
    <button class="btn secondary" id="adminBtn" disabled>Admin Panel</button>
    <button id="talkBtn" class="btn primary">🌸 अंजली से बात करें</button>
  </div>

  <div class="footer">Foundation • Stage-1</div>

  <!-- ========== CORE SCRIPTS (UNCHANGED) ========== -->
  <script src="core/AnjaliCore.js"></script>
  <script src="core/ContextMemory.js"></script>
  <script src="learning/ExperienceMemory.js"></script>
  <script src="learning/KnowledgeBase.js"></script>
  <script src="answer/RawKnowledgeReader.js"></script>
  <script src="answer/KnowledgeAnswerEngine.js"></script>
  <script src="core/ReasoningEngine.js"></script>
  <script src="response/ResponseEngine.js"></script>
  <script src="voice/tts.js"></script>
  <script src="voice/stt.js"></script>
  <script src="voice/STT_LongListening.js"></script>
  <script src="presence/AnjaliPresence.js"></script>

  <div class="footer">
    <button onclick="openSystemStatus()" class="btn secondary">🌸 System Status</button>
    <br><br>
    <button onclick="openDiagnosticPanel()" class="btn">🔍 Diagnostic</button>
  </div>

  <script>
    document.getElementById("adminBtn").onclick = () => {
      window.open("admin.html", "_blank");
    };
    function openSystemStatus() {
      window.open("anjali_system_status.html", "_blank");
    }
    function openDiagnosticPanel() {
      window.open("anjali_system_diagnostic.html", "_blank");
    }
    document.getElementById("talkBtn").onclick = function () {
      window.location.href = "talk_to_anjali.html";
    };
  </script>

  <!-- 🔐 PASSWORD LOGIC (USER-DEFINED) -->
  <script>
    const ACCESS_KEY = "ANJALI_ACCESS_OK";
    const PASSWORD_KEY = "ANJALI_USER_PASSWORD";

    function verifyPassword(){
      const v = document.getElementById("passwordInput").value.trim();
      const msg = document.getElementById("passwordMsg");

      if(!/^\d{10}$/.test(v)){
        msg.textContent = "❌ 10 अंकों का पासवर्ड लिखें";
        return;
      }

      const saved = localStorage.getItem(PASSWORD_KEY);

      if(!saved){
        localStorage.setItem(PASSWORD_KEY, v);
        localStorage.setItem(ACCESS_KEY, "YES");
        unlock();
        return;
      }

      if(v === saved){
        localStorage.setItem(ACCESS_KEY, "YES");
        unlock();
      }else{
        msg.textContent = "❌ गलत पासवर्ड";
      }
    }

    function unlock(){
      document.getElementById("startBtn").disabled = false;
      document.getElementById("adminBtn").disabled = false;
      document.getElementById("passwordGate").style.display = "none";
    }

    window.addEventListener("load",()=>{
      if(localStorage.getItem(ACCESS_KEY)==="YES"){
        unlock();
      }
    });
  </script>

  <script src="main.js"></script>
</main>
</body>
</html>
